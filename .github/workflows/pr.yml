name: Check for 100% test coverage
on:
  # every pull request, whatever branch it targets
  pull_request:
  # every merge into a protected branch, as pull requests that pass apart can fail together
  # github notifies whoever pushed or merged when this run fails
  push:
    branches: ['develop', 'v*']
# a new push to a pull request cancels the run for the previous one
# while every merge keeps its own run, so a failure points at the merge that caused it
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # report every node version, even when one of them fails
      fail-fast: false
      matrix:
        include:
          - node-version: '24.x'
            marker: node_24
          - node-version: '26.x'
            marker: node_26
    outputs:
      node_24: ${{ steps.marker.outputs.node_24 }}
      node_26: ${{ steps.marker.outputs.node_26 }}
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run coverage
      - run: npm run build
      - id: marker
        run: echo "${{ matrix.marker }}=success" >> "$GITHUB_OUTPUT"
  tests:
    name: Tests
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          NODE_24: ${{ needs.build.outputs.node_24 }}
          NODE_26: ${{ needs.build.outputs.node_26 }}
        run: |
          echo "node_24=${NODE_24:-missing} node_26=${NODE_26:-missing}"
          test "$NODE_24" = success && test "$NODE_26" = success
